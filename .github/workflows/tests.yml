name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s test -p 'test_*.py'
      # 只把「未定義名稱」當錯誤：那是真 bug（新版 Python 只在特定路徑才會炸）。
      # import 未使用／f-string 缺佔位符是風格問題，不擋 CI。
      - name: Static check (undefined names only)
        run: |
          out=$(python -m pyflakes selfselect_trader.py core scripts strategies data utils || true)
          echo "$out"
          if echo "$out" | grep -qi "undefined name"; then
            echo "::error::發現未定義名稱（會導致執行期 NameError）"
            exit 1
          fi
